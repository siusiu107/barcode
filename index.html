<!DOCTYPE html><html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>효도쿠폰 스캐너</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    #scanner-container { position: relative; width: 100%; max-width: 400px; margin: 0 auto; }
    #scanner { width: 100%; height: auto; border: 2px solid #333; border-radius: 8px; }
    #couponInfo { margin-top: 20px; }
    .coupon { display: inline-block; border: 2px solid #333; border-radius: 10px; padding: 20px; text-align: left; width: 300px; }
    .coupon h2 { margin-top: 0; }
    button { padding: 10px 20px; font-size: 16px; margin-top: 10px; }
    .used, .expired { opacity: 0.5; }
  </style>
</head>
<body>
  <h1>효도쿠폰 스캐너</h1>
  <div id="scanner-container">
    <video id="scanner" autoplay muted></video>
    <p>쿠폰 바코드를 화면에 비춰주세요.</p>
    <button onclick="stopScanner()">취소</button>
  </div>
  <div id="couponInfo"></div>  <script>
    const expiryDate = new Date('2025-05-31');
    const coupons = [
      { id: '001', name: '방청소 쿠폰' },
      { id: '002', name: '설거지 쿠폰' },
      { id: '003', name: '안마 쿠폰' }
    ];
    coupons.forEach(c => c.used = localStorage.getItem('coupon_used_' + c.id) === 'true');

    // 스캐너 시작
    function startScanner() {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(stream => {
          document.getElementById('scanner').srcObject = stream;
          Quagga.init({
            inputStream: { type: 'LiveStream', constraints: { facingMode: 'environment' }, target: document.getElementById('scanner') },
            decoder: { readers: ['code_128_reader'] }
          }, err => {
            if (err) { console.error(err); return; }
            Quagga.start();
          });
          Quagga.onDetected(onDetected);
        })
        .catch(err => { alert('카메라 권한이 필요합니다.'); });
    }

    function stopScanner() {
      Quagga.stop();
      const video = document.getElementById('scanner');
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
        video.srcObject = null;
      }
      document.getElementById('scanner-container').style.display = 'none';
    }

    // 바코드 인식 시
    function onDetected(result) {
      const code = result.codeResult.code;
      stopScanner();
      showCoupon(code);
    }

    // 쿠폰 정보 표시
    function showCoupon(code) {
      const info = document.getElementById('couponInfo');
      const coupon = coupons.find(c => c.id === code);
      const today = new Date();
      if (!coupon) {
        info.innerHTML = `<p>유효하지 않은 쿠폰 코드입니다: ${code}</p>`;
        return;
      }
      const expired = today > expiryDate;
      const isUsed = coupon.used;
      const statusText = isUsed ? '이미 사용됨' : expired ? '만료됨' : '사용 가능';
      const disabled = (isUsed || expired) ? 'disabled' : '';

      info.innerHTML = `
        <div class="coupon ${isUsed? 'used':''} ${expired? 'expired':''}">
          <h2>${coupon.name}</h2>
          <p>유효기간: 2025년 05월 31일</p>
          <p>상태: <strong>${statusText}</strong></p>
          <button ${disabled} onclick="useCoupon('${coupon.id}')">사용하기</button>
        </div>
      `;
    }

    function useCoupon(id) {
      const coupon = coupons.find(c => c.id === id);
      if (!coupon.used && new Date() <= expiryDate) {
        coupon.used = true;
        localStorage.setItem('coupon_used_' + id, 'true');
        showCoupon(id);
      }
    }

    // 페이지 로드 시 자동 시작
    window.addEventListener('DOMContentLoaded', () => {
      startScanner();
    });
  </script></body>
</html>
