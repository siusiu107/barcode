<!DOCTYPE html><html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>효도쿠폰 스캐너</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; margin: 0; }
    #scanner-container { display: none; position: relative; width: 100%; max-width: 400px; margin: 20px auto; }
    #scanner { width: 100%; height: auto; border-radius: 8px; }
    #couponInfo { margin-top: 20px; }
    .coupon { display: inline-block; border: 2px solid #333; border-radius: 10px; padding: 20px; text-align: left; width: 90%; max-width: 300px; }
    .coupon h2 { margin-top: 0; }
    button { padding: 12px 24px; font-size: 16px; margin: 10px 0; }
    .used, .expired { opacity: 0.5; }
  </style>
</head>
<body>
  <h1>효도쿠폰 스캐너</h1>
  <button id="startBtn">바코드 스캔 시작</button>
  <div id="scanner-container">
    <video id="scanner" autoplay muted playsinline></video>
    <p>쿠폰 바코드를 화면에 비춰주세요.</p>
    <button id="cancelBtn">스캔 취소</button>
  </div>
  <div id="couponInfo"></div>  <script>
    const expiryDate = new Date('2025-05-31');
    const coupons = [
      { id: '001', name: '방청소 쿠폰' },
      { id: '002', name: '설거지 쿠폰' },
      { id: '003', name: '안마 쿠폰' }
    ];
    coupons.forEach(c => c.used = localStorage.getItem('coupon_used_' + c.id) === 'true');

    let cameraStream;

    function initScanner() {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(stream => {
          cameraStream = stream;
          const video = document.getElementById('scanner');
          video.srcObject = stream;
          document.getElementById('startBtn').style.display = 'none';
          document.getElementById('scanner-container').style.display = 'block';

          Quagga.init({
            inputStream: {
              name: 'Live',
              type: 'LiveStream',
              target: video,
              constraints: { facingMode: 'environment' }
            },
            decoder: { readers: ['code_128_reader'] }
          }, err => {
            if (err) { console.error(err); stopScanner(); return; }
            Quagga.start();
          });

          Quagga.onDetected(onDetected);
        })
        .catch(err => {
          console.error('Camera permission needed', err);
          alert('카메라 권한이 필요합니다. 브라우저 설정을 확인하세요.');
        });
    }

    function stopScanner() {
      Quagga.stop();
      const video = document.getElementById('scanner');
      if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
      }
      document.getElementById('scanner-container').style.display = 'none';
      document.getElementById('startBtn').style.display = 'inline-block';
    }

    function onDetected(result) {
      const code = result.codeResult.code;
      stopScanner();
      showCoupon(code);
    }

    function showCoupon(code) {
      const info = document.getElementById('couponInfo');
      const coupon = coupons.find(c => c.id === code);
      const today = new Date();
      if (!coupon) {
        info.innerHTML = `<p>유효하지 않은 쿠폰 코드입니다: ${code}</p>`;
        return;
      }
      const expired = today > expiryDate;
      const isUsed = coupon.used;
      const statusText = isUsed ? '이미 사용됨' : expired ? '만료됨' : '사용 가능';
      const disabled = (isUsed || expired) ? 'disabled' : '';

      info.innerHTML = `
        <div class="coupon ${isUsed? 'used':''} ${expired? 'expired':''}">
          <h2>${coupon.name}</h2>
          <p>유효기간: 2025년 05월 31일</p>
          <p>상태: <strong>${statusText}</strong></p>
          <button ${disabled} onclick="useCoupon('${coupon.id}')">사용하기</button>
        </div>
      `;
    }

    function useCoupon(id) {
      const coupon = coupons.find(c => c.id === id);
      if (coupon && !coupon.used && new Date() <= expiryDate) {
        coupon.used = true;
        localStorage.setItem('coupon_used_' + id, 'true');
        showCoupon(id);
      }
    }

    document.getElementById('startBtn').addEventListener('click', initScanner);
    document.getElementById('cancelBtn').addEventListener('click', stopScanner);
  </script></body>
</html>
